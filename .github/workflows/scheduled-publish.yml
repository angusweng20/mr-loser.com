# 排程發布。
# 網站是靜態的，未來日期的文章要等下一次建置才會出現。
# 這個 workflow 每天 09:00（台北）呼叫 Cloudflare Pages 的 Deploy Hook 重建一次。
# 需要在 GitHub repo 的 Settings → Secrets 設定 CLOUDFLARE_DEPLOY_HOOK。
name: scheduled-publish

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 09:00 Asia/Taipei
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK 尚未設定"; exit 1
          fi
          curl -fsS -X POST "$HOOK"

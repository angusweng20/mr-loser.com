# 建置並部署到 Cloudflare Pages。
#
# - push 到 main            → 正式站 mr-loser.com
# - push 到其他 branch       → 預覽網址 <branch>.mr-loser.pages.dev，會顯示草稿與排程文章
# - 每天 09:00（台北）      → 重建正式站，讓 pubDate 已到的排程文章出現
# - 手動觸發                → 同上
#
# 需要的 GitHub Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# 選填的 GitHub Variable：CF_BEACON_TOKEN（Cloudflare Web Analytics）
name: deploy

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 09:00 Asia/Taipei
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # main 以外的 branch 顯示草稿與排程文章
          SHOW_DRAFTS: ${{ github.ref_name != 'main' && 'true' || '' }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.129.0 pages deploy dist
          --project-name=mr-loser
          --branch="${GITHUB_REF_NAME}"
          --commit-hash="${GITHUB_SHA}"
          --commit-message="${GITHUB_REF_NAME}: ${GITHUB_SHA::7}"
